name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify-release:
    name: Verify release (mise toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Verify release
        run: mise exec -- pnpm verify:release
