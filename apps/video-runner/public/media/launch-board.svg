      <stop offset="0" stop-color="#111b2a"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#10111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
