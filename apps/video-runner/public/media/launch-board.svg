      <g transform="translate(390 120)"><circle r="24" fill="#25d366"/><path d="m-9 0 7 7 13-15" fill="none" stroke="#07130d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text y="58" fill="#dce5ee">Review</text></g>
