<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Launch control board</title>
  <desc id="description">A deterministic product launch dashboard with approved render, quality, and publish stages.</desc>
  <defs>
